# 下视相机固定 V4L2 参数；除曝光时间按下视识别需要设为 50 外，其余与 video_service 一致。
# 收到首帧且视频流稳定后，按文件顺序写入并最终逐项读回。
# 手动曝光、曝光时间和增益必须优先，避免设备开流恢复默认值覆盖预设。
[controls]
auto_exposure = 1
exposure_time_absolute = 50
gain = 200
brightness = 6
contrast = 6
saturation = 6
hue = 0
sharpness = 6
power_line_frequency = 1
zoom_absolute = 10
