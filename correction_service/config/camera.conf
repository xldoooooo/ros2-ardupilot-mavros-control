# UQ212 下视相机只负责本服务的带硬件 PTS 灰度采集，不含 RTSP/录像配置。
# 2026-09-16 在 refresh 飞机只读探测：UQ212 位于 USB 3.1，by-id 不依赖枚举序号。
[camera]
device = /dev/v4l/by-id/usb-YLX-WYZ-260812_UQ212_UQ212-video-index0
width = 1920
height = 1080
# UQ212 在 1920x1080 MJPEG 下只枚举原生 120 fps，不请求未声明的 30 fps。
fps = 120
pixel_format = mjpeg
frame_id = correction_camera_optical_frame
image_topic = /correction_service/image_raw
max_capture_age_ms = 200.0

[driver]
# 包名保留历史名称；当前实现是通用 V4L2 MJPEG + Jetson 硬件解码采集节点。
package = wasintek_gst_camera
executable = camera_node
