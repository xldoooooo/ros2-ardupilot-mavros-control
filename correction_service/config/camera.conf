# 下视 Wasintek 相机只负责本服务的带硬件 PTS 灰度采集，不含 RTSP/录像配置。
# 2026-09-09 真机逐路取帧确认：USB 1.2 正对地面 Tag0；USB 2 是另一台房间视角相机。
[camera]
device = /dev/v4l/by-path/platform-3610000.usb-usb-0:1.2:1.0-video-index0
width = 1920
height = 1080
fps = 30
pixel_format = mjpeg
frame_id = correction_camera_optical_frame
image_topic = /correction_service/image_raw
max_capture_age_ms = 200.0

[driver]
package = wasintek_gst_camera
executable = camera_node
