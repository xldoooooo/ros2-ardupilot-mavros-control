# AprilTag-Odin 修正任务、同步、质量和 ROS 话题配置。
interface_version: "2.0"

topics:
  raw_odometry: /odin1/odometry_highfreq
  corrected_odometry: /odin1/odometry_highfreq_corrected
  camera_image: /correction_service/image_raw
  correction_status: /correction_service/status
  correction_result: /correction_service/result
  extnav_status: /extnav/correction_status
  start_service: /correction_service/start
  stop_service: /correction_service/stop
  clear_window_service: /correction_service/clear_window
  apply_saved_service: /correction_service/apply_saved
  set_correction_service: /extnav/set_correction

detection:
  tag_family: tag36h11
  processing_rate_hz: 10.0
  image_scale: 0.5
  corner_refinement: true
  max_reprojection_error_px: 2.0
  # 2026-09-09 地面原理验证：实测约 7.9~8.0deg，放宽到 10deg 避免边界抖动锁死采样；
  # 仍只允许水平 SE(2)，此值不能作为外参或世界坐标精度合格证据。
  max_correction_tilt_deg: 10.0
  # TODO(task27-multitag): 首版明确拒绝同帧多 Tag；后续在此扩展联合估计策略。
  reject_multiple_tags: true

synchronization:
  odometry_history_seconds: 4.0
  max_header_delta_ms: 20.0
  # 当前 Odin header 为设备时钟、相机 PTS 为 ROS 时钟；不同 epoch 时在历史
  # 缓冲内按本机接收时刻匹配，仍禁止使用识别完成时的最新 odometry。
  max_arrival_delta_ms: 30.0
  header_epoch_tolerance_seconds: 5.0

quality:
  minimum_samples: 24
  rolling_window_samples: 60
  minimum_span_seconds: 2.0
  max_position_std_m: 0.025
  max_yaw_std_deg: 0.35
  max_position_range_m: 0.12
  max_yaw_range_deg: 2.0
  divergence_position_range_m: 0.60
  divergence_yaw_range_deg: 12.0
  mad_outlier_scale: 4.5

# 一个停留段内先按时间块估计有效独立信息，再施加不可被帧数消除的公制误差下限。
keyframe:
  correlation_block_seconds: 0.25
  minimum_independent_blocks: 5
  odin_position_noise_floor_m: 0.005
  tag_world_sigma_m: 0.005
  # 当前下视相机曾拆装；此项是原理验证的保守误差下限，不是重新实测结果。
  extrinsic_sigma_m: 0.010
  minimum_effective_sigma_m: 0.012
  maximum_effective_sigma_m: 0.250
  max_sync_motion_error_m: 0.030

# 滑窗默认 5、最大 20；长度 2 可求解/应用，但只能标记为有限离群识别能力。
window:
  default_size: 5
  maximum_size: 20
  minimum_baseline_m: 1.0
  maximum_baseline_ratio_error: 0.15
  maximum_window_span_seconds: 1800.0
  maximum_keyframe_gap_seconds: 600.0
  candidate_max_age_seconds: 300.0
  max_registration_rms_m: 0.080
  max_registration_residual_m: 0.150
  max_model_yaw_std_deg: 1.0
  max_prior_model_residual_m: 0.500
  max_apply_position_jump_m: 1.0
  # 地面未武装原理验证允许观察较大的世界系偏航修正；应用仍需显式确认和全部其他门限通过。
  max_apply_yaw_jump_deg: 45.0
  recommended_precision_keyframes: 3

# 仅用于复算候选在飞控参考中心处的实际跳变；extnav 状态必须回报同一参数。
fcu_reference:
  lever_arm_m: [0.06, -0.03, 0.05]
  parameter_tolerance: 0.000001
  require_zero_installation_angles: true

timeouts:
  camera_start_seconds: 12.0
  first_tag_seconds: 20.0
  extnav_apply_seconds: 5.0
  # ACK 丢失后只用新鲜 extnav 权威状态做有限对账，仍不确定则锁存 unknown。
  extnav_reconcile_seconds: 3.0
  # first/next 均为单次收敛自动结束；防止相机因永不收敛而无限占用。
  ground_max_runtime_seconds: 60.0

logging:
  directory: ../log
  service_log_max_bytes: 5242880
  service_log_backups: 4
  sample_summary_period_seconds: 1.0
