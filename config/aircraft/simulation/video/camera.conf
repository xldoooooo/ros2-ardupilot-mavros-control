# 机载摄像头、RTSP 与媒体保存参数；每次“关闭→开启摄像头”时重新读取。
# 本文件不修改飞控参数，也不会随 onboard_control 的启停而自动改写。

[camera]
# auto 自动选 /dev/v4l/by-id/*-video-index0；也可填写明确的稳定设备路径。
device = auto
# 本项目使用摄像头原生压缩码流，可填 h264 或 mjpeg。
# 同型号 Wasintek 在本机 v4l2-ctl 实测且本服务可用的完整搭配：
#   h264 4048x3040@10
#   h264 3840x2160@30/15/10
#   h264 1920x1080@60/30/20/15/10/7.5
#   h264 1280x720@120/60/30/20/15/10
#   mjpeg 1920x1080@60/30
#   mjpeg 1280x720@120/60/30
# 摄像头也声明 MJPEG 3840x2160@30、4048x3040@10，但 RTP/JPEG 的
# RFC 2435 尺寸字段无法表达超过 2040 像素的边长，本服务会明确拒绝这两组。
# 更换摄像头后必须以该机 `v4l2-ctl --list-formats-ext` 为准，服务不猜测模式。
codec = h264
# 默认使用同型号摄像头已声明支持的 1920x1080@60；宽高和帧率必须由目标
# 摄像头实际支持，更换硬件后先按 README 探测，不能照搬本默认值。
width = 1920
height = 1080
fps = 60

[rtsp]
# 机载 MediaMTX 固定仅监听回环，供截图和主动推流使用。
advertise_ip = 127.0.0.1
# MediaMTX 监听端口为 1024～65535；路径允许多段，如 aircraft/camera。
port = 8554
path = camera

[storage]
# 原始媒体仅供本机缓存与上传；地面确认入库后才开始缓存保留期。
video_directory = ~/.local/share/ardupilot-media/cache/videos
image_directory = ~/.local/share/ardupilot-media/cache/images
# 图片按协议固定为 JPG；录像封装可填 mp4、mkv、avi。
# MP4 为推荐的分片封装；MKV 容错较好；AVI 主要用于传统 MJPEG 播放器。
image_format = jpg
video_format = mp4

[runtime]
# MediaMTX 是系统依赖，不随 Git 仓库分发；按 README 安装后使用该固定路径。
mediamtx_binary = /usr/local/bin/mediamtx
# VideoStatus 周期发布，地面端超过 3 秒未收到会判定为失联。
status_period_seconds = 1.0

[media]
# 各机主动发布一条原始流；外部读取地面的 rectified 路径。
push_url = rtsp://192.168.112.111:8554/simulation/raw
public_url = rtsp://192.168.112.111:8554/simulation/rectified
ground_api = http://192.168.112.111:8090
# 与地面 media.json 的 root 保持一致；预先配置本用户到该目标的 SSH 密钥。
upload_target = intel@192.168.112.111
upload_root = /home/intel/Media/ardupilot
cache_directory = ~/.local/share/ardupilot-media/cache
# 入库确认后保留一天，未确认文件不会按此规则清理；上传限速 KiB/s。
retain_seconds = 86400
bwlimit_kib = 2048
