# UQ212 下视相机只负责本服务的 UVC 灰度采集，保留 V4L2 采集时间戳，不含 RTSP/录像配置。
# UQ212 小视场镜头使用 1920x1200@60 标定档位；同一电路板的 by-id 保持不变。
[camera]
device = /dev/v4l/by-id/usb-YLX-WYZ-260812_UQ212_UQ212-video-index0
width = 1920
height = 1200
# 与本镜头内参标定一致，使用设备原生声明的 1920x1200 MJPEG 60 fps。
fps = 60
# 仅限制解码/ROS 发布的平均频率；相机原生 fps 不变，0 表示不限频。
publish_fps = 30.0
pixel_format = mjpeg
frame_id = correction_camera_optical_frame
image_topic = /correction_service/image_raw
max_capture_age_ms = 200.0

[driver]
package = correction_service
executable = uvc_camera_node
