# UQ212 下视相机 V4L2 默认参数；默认值来自 refresh 飞机上的
# `v4l2-ctl --list-ctrls-menus`（2026-09-16）。收到首帧且视频流稳定后按顺序
# 显式恢复并读回这些默认值，避免设备曾被其他程序调参后留下非默认状态。
[controls]
auto_exposure = 3
white_balance_automatic = 1
focus_automatic_continuous = 0
brightness = 0
contrast = 34
saturation = 60
hue = 0
gamma = 120
sharpness = 2
backlight_compensation = 1
power_line_frequency = 1
zoom_absolute = 0
