# Odin IMU I -> FCU FLU F installation; learn ground pitch once, then hold until node restart.
# R_FI = Rz(yaw_cam) Ry(pitch_cam) Rx(roll_cam), radians; upward nose tilt is negative pitch.
# odin_xyz is FCU-origin -> Odin-IMU-origin, expressed in F, in metres.
# Override with ODIN_EXTRINSICS_FILE; pitch is fallback, roll/yaw and translation stay configured.
/extnav_to_vision_pose:
  ros__parameters:
    auto_installation: true
    auto_installation_seconds: 3.0
    roll_cam: 0.0
    pitch_cam: 0.0
    yaw_cam: 0.0
    odin_x: 0.06
    odin_y: -0.03
    odin_z: 0.05
