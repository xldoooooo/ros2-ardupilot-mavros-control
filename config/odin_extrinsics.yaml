# Odin IMU I -> FCU FLU F installation; keep the legacy zero-angle default.
# R_FI = Rz(yaw_cam) Ry(pitch_cam) Rx(roll_cam), radians; upward nose tilt is negative pitch.
# odin_xyz is FCU-origin -> Odin-IMU-origin, expressed in F, in metres.
# Override with ODIN_EXTRINSICS_FILE for each aircraft; use each aircraft's installation estimate or calibration.
/extnav_to_vision_pose:
  ros__parameters:
    roll_cam: 0.0
    pitch_cam: 0.0
    yaw_cam: 0.0
    odin_x: 0.06
    odin_y: -0.03
    odin_z: 0.05
