# SITL 与实机共同使用的机载控制、安全和 PD+DOB 参数。
/**:
  ros__parameters:
    # Fixed-rate execution and aggregated status publication.
    control_frequency: 100.0
    status_frequency: 10.0

    # Telemetry and link-loss safety thresholds.
    pose_timeout_seconds: 0.30
    state_timeout_seconds: 2.0
    link_loss_land_timeout_seconds: 10.0
    takeoff_timeout_seconds: 45.0
    max_clock_skew_seconds: 2.0

    # Onboard waypoint arrival and keyboard reference generation.
    waypoint_tolerance: 0.30
    waypoint_hold_seconds: 1.0
    max_velocity_xy: 1.5
    max_velocity_z: 0.8
    max_yaw_rate: 1.0
    max_reference_error_xy: 0.8
    max_reference_error_z: 0.5

    # Position PD + first-order disturbance observer.
    hover_wn_xy: 2.236
    hover_zeta_xy: 0.8
    hover_wn_z: 2.236
    hover_zeta_z: 0.6
    dob_L_xy: 1.5
    dob_L_z: 0.6

    # Thrust mapping and hard output limits. The startup fallback is replaced by
    # the FCU's calibrated MOT_THST_HOVER before raw attitude control is enabled.
    hover_throttle: 0.39
    thrust_ratio: 2.5
    gravity: 9.8
    max_acceleration_xy: 4.0
    max_acceleration_z: 4.0
    max_disturbance: 3.0
    max_tilt_degrees: 25.0
    min_total_acceleration_z: 2.0

    # A namespace can be remapped for multi-vehicle work without changing code.
    mavros_prefix: /mavros
    interface_prefix: /onboard_control
