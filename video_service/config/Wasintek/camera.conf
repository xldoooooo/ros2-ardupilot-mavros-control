# Wasintek 机载视频配置档案；复制自 2026-09-16 更换下视相机前的活动配置。
# 本文件只用于保留旧相机配置，不会被 video_service 自动加载。

[camera]
# auto 自动选 /dev/v4l/by-id/*-video-index0；也可填写明确的稳定设备路径。
device = auto
# Wasintek 原生压缩码流配置。
codec = h264
width = 1920
height = 1080
fps = 60

[rtsp]
advertise_ip = auto
port = 8554
path = camera

[storage]
video_directory = /home/share
image_directory = /home/share/jpg
image_format = jpg
video_format = mp4

[runtime]
mediamtx_binary = /usr/local/bin/mediamtx
status_period_seconds = 1.0
