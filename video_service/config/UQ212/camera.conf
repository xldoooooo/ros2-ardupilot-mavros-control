# UQ212 机载视频配置档案；根 config/camera.conf 仍是当前运行配置。
[camera]
device = /dev/v4l/by-id/usb-YLX-WYZ-260812_UQ212_UQ212-video-index0
codec = mjpeg
width = 1920
height = 1080
fps = 120

[rtsp]
advertise_ip = auto
port = 8554
path = camera

[storage]
video_directory = /home/share
image_directory = /home/share/jpg
image_format = jpg
video_format = mp4

[runtime]
mediamtx_binary = /usr/local/bin/mediamtx
status_period_seconds = 1.0
