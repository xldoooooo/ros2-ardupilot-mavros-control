# Wasintek 镜头参数；每次“关闭→开启摄像头”时在 FFmpeg 打开设备前应用。
# 下列默认值和范围来自同型号摄像头的 v4l2-ctl --list-ctrls-menus 实测。
# 服务不夹紧或修正用户值；驱动拒绝时会如实报告视频启动失败，但不影响飞控。

[controls]
# 自动曝光菜单：驱动默认 3；本任务指定 1（Manual Mode）；驱动范围 0～3。
auto_exposure = 1
# 绝对曝光时间：驱动默认 156；本任务指定 25；范围 1～2500，步长 1。
exposure_time_absolute = 25
# 增益：驱动默认 0；本任务指定 200；范围 0～377，步长 1。
gain = 200

# 以下项目按摄像头原始默认值设置。
# 亮度：默认 6；范围 1～10。
brightness = 6
# 对比度：默认 6；范围 1～10。
contrast = 6
# 饱和度：默认 6；范围 1～10。
saturation = 6
# 色调：默认 0；范围 -18000～18000。
hue = 0
# 锐度：默认 6；范围 1～10。
sharpness = 6
# 电源频率：默认 1（50 Hz）；0=关闭、1=50 Hz、2=60 Hz。
power_line_frequency = 1
# 数字变焦：默认 10；范围 10～40。
zoom_absolute = 10
