fpga_kino_planner_node:
  ros__parameters:
    fpga_ip: "192.168.2.10"
    bind_ip: "192.168.2.100"
    udp_port: 4000
    udp_spin_wait_us: 4500
    udp_spin_adaptive: true
    udp_spin_min_us: 800
    udp_blocking_poll_us: 250
    udp_broadcast_fallback: false
    native_cpp_accel: true
    candidate_cpp_accel: true
    incremental_qubo: true
    incremental_qubo_cache_size: 128
    mock: false
    frame_id: "camera_init"
    cloud_topic: "/cloud_registered"
    odom_topic: "/mavros/odometry/out"
    goal_topic: "/goal"
    output_path_topic: "kino_path"
    publish_search_node: false
    comparison_path_topic: "/fpga_ising/trajectory_position"
    resolution_m: 0.2
    resolution_z_m: 0.2
    window_margin_m: 2.0
    window_radius_m: 8.0
    z_margin_m: 1.2
    max_axis_cells: 120
    max_z_cells: 24
    uav_radius_m: 0.45
    safety_margin_m: 0.05
    iterations: 1400
    restarts: 8
    waypoint_count: 32
    candidates_per_layer: 8
    dt_s: 0.0
    dt_auto: true
    cruise_speed_mps: 1.5
    dt_sample_s: 0.02
    max_vel_mps: 2.0
    max_acc_mps2: 2.0
    publish_speed_ratio: 0.96
    qubo_dt_quantum_s: 0.02
    strict_spine_latency_fuse_ms: 3.5
    w_acc: 2.0
    w_spine: 0.45
    w_len: 0.35
    a_mult: 3.0
    safe_clearance_m: 0.3
    adaptive_problem_size: true
    adaptive_solver_profile: true
    quality_gap_ratio: 0.05
    quality_guard: true
    adaptive_budget: true
    fpga_early_restart_stop: true
    reuse_previous_path: true
    reuse_refresh_interval: 0
    reuse_refresh_period_s: 60.0
    reuse_refresh_min_interval_s: 2.0
    reuse_refresh_on_bypass: true
    reuse_refresh_bypass_count: 6
    reuse_refresh_shortcut_ratio: 0.0
    shortcut_reused_spine: true
    near_goal_direct_m: 4.0
    near_goal_tiny_m: 4.0
    near_goal_direct_cross_speed_mps: 0.8
    near_goal_direct_endpoint_grace_m: 0.4
    near_hysteresis_distance_m: 4.5
    near_hysteresis_detour_ratio: 1.06
    near_hysteresis_improvement_ratio: 0.02
    cloud_radius_m: 20.0
    cloud_stride: 2
    max_cloud_points: 6000
    require_cloud: true
    max_cloud_age_s: 1.0
    replan_on_cloud: true
    cloud_replan_min_period_s: 0.10
    cloud_defer_during_solve: true
    skip_unchanged_replan: true
    replan_period_s: 0.0
    replan_distance_m: 0.25
    solver_persistent_worker: true
    solver_gc_guard: true
    solver_preflight_ping: true
    clearance_cache_policy: versioned
    solver_cpu_affinity: -1  # -1=portable default/off; -2=optional auto least-loaded CPU; >=0=fixed CPU
