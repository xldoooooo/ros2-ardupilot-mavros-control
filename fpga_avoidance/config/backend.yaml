# Optional FPGA settings, read only after explicit selection; all flight limits stay enforced.
fpga_ip: "192.168.2.10"
bind_ip: "192.168.2.100"
udp_port: 4000
mock: false
resolution_m: 0.2
resolution_z_m: 0.2
uav_radius_m: 0.45
safety_margin_m: 0.05
safe_clearance_m: 0.3
window_radius_m: 8.0
window_margin_m: 2.0
z_margin_m: 1.2
max_axis_cells: 120
max_z_cells: 24
max_vel_mps: 2.0
max_acc_mps2: 2.0
# Directional execution limits; retain the current CPU planner's 2 m/s and 2 m/s² bounds.
max_velocity_xy: 2.0
max_velocity_z: 2.0
max_acceleration_xy: 2.0
max_acceleration_z: 2.0
cruise_speed_mps: 1.5
waypoint_count: 32
candidates_per_layer: 8
iterations: 1400
restarts: 8
input_timeout: 1.0
replan_interval: 0.2
replan_distance: 1.0
# Metres: preserve a still-valid zero-speed terminal curve, matching the CPU backend's scheduler.
near_goal_replan_distance: 0.3
