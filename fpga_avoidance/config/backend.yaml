# Optional FPGA settings, read only after explicit selection; all flight limits stay enforced.
fpga_ip: "192.168.2.10"
bind_ip: "192.168.2.100"
udp_port: 4000
mock: false
# Use the uav002 autonomous profile as the numeric clearance/resolution reference.
# Solid-voxel checking also adds one voxel diagonal: total inflation is about 0.523 m.
resolution_m: 0.1
resolution_z_m: 0.1
uav_radius_m: 0.35
safety_margin_m: 0.0
# Original QUBO clearance preference; this is not the map's inflation radius.
safe_clearance_m: 0.3
window_radius_m: 8.0
window_margin_m: 2.0
z_margin_m: 1.2
# Retain the XY window capacity; 100 Z cells also cover uav001's 0.2..10 m bounds.
max_axis_cells: 240
max_z_cells: 100
max_vel_mps: 2.0
max_acc_mps2: 1.0
# Use the uav002 autonomous motion limits: 2 m/s and 1 m/s².
max_velocity_xy: 2.0
max_velocity_z: 2.0
max_acceleration_xy: 1.0
max_acceleration_z: 1.0
# Match the CPU output sampling interval; analytic collision checking is unchanged.
dt_sample_s: 0.02
cruise_speed_mps: 1.5
waypoint_count: 32
candidates_per_layer: 8
iterations: 1400
restarts: 8
input_timeout: 1.0
replan_interval: 0.2
replan_distance: 1.0
# Metres: preserve a still-valid zero-speed terminal curve, matching the CPU backend's scheduler.
near_goal_replan_distance: 0.3
